<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperClip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-toolbar">
  <button id="settingsBtn" class="settings-btn" aria-label="Library settings" title="Library settings">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="settings-menu" id="settingsMenu" hidden>
    <label class="settings-menu-item settings-switch" title="When off, a tab is only added when you click the PaperClip toolbar icon on it">
      <span class="settings-switch-text">Auto-add papers I open</span>
      <input type="checkbox" id="autoAddToggle" role="switch">
      <span class="settings-switch-track" aria-hidden="true"></span>
    </label>
    <div class="settings-divider"></div>
    <div class="settings-folder">
      <div class="settings-folder-label">Library folder</div>
      <div class="settings-folder-row">
        <span class="settings-folder-name is-unset" id="folderName">Not set</span>
        <button class="settings-folder-btn" data-settings-action="choose-folder">Choose…</button>
      </div>
      <button class="settings-folder-btn settings-folder-reconnect" id="folderReconnectBtn" data-settings-action="reconnect-folder" hidden>Reconnect folder</button>
      <div class="settings-folder-hint" id="folderHint"></div>
    </div>
    <div class="settings-divider"></div>
    <button class="settings-menu-item" data-settings-action="export">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" x2="12" y1="15" y2="3"/>
      </svg>
      Export library (.zip)…
    </button>
    <button class="settings-menu-item" data-settings-action="import">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" x2="12" y1="3" y2="15"/>
      </svg>
      Import library (.zip or .json)…
    </button>
    <div class="settings-divider"></div>
    <div class="settings-info" id="settingsInfo">—</div>
    <div class="settings-status" id="settingsStatus" hidden></div>
  </div>
</div>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <main class="main-pane">

  <section id="paperLibrary" class="paper-library">
    <div class="section-header">
      <h2>Library</h2>
      <div class="section-line"></div>
      <div class="section-count" id="paperCount"></div>
    </div>

    <div class="paper-search-wrap">
      <svg class="paper-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="paperSearch" placeholder="Search by title, author, venue…" autocomplete="off">
    </div>

    <input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" hidden>

    <div class="paper-table">
      <div class="paper-table-inner">
        <div class="paper-list-header" id="paperListHeader">
          <button class="paper-select-all-checkbox" id="selectAllCheckbox" title="Select all" aria-label="Select all"></button>
          <div class="paper-col-label paper-col-head paper-col-head-title">Title<div class="col-resizer" data-resize-col="title" title="Drag to resize · double-click to reset"></div></div>
          <div class="paper-col-label paper-col-head paper-col-head-figure">Figure<div class="col-resizer" data-resize-col="figure" title="Drag to resize · double-click to reset"></div></div>
          <!-- Header cells for every other column (Authors, Year, Note, tag
               columns) in the user's order, rendered by app.js -->
          <div class="col-headers" id="columnHeaders"></div>
          <div class="add-tag-col-cell">
            <button class="add-tag-col-btn" data-column-action="add" title="Add a tag column">+ Column</button>
          </div>
        </div>

        <div id="paperList" class="paper-list"></div>
      </div>
    </div>

    <div id="paperEmpty" class="paper-empty" style="display:none">
      <div data-empty-state="initial">
        <p class="paper-empty-title">No papers yet.</p>
        <p class="paper-empty-sub">Open an arXiv page, an OpenReview submission, or any PDF and it'll show up here automatically.</p>
      </div>
      <div data-empty-state="no-results" style="display:none">
        <p class="paper-empty-title">No matches.</p>
        <p class="paper-empty-sub">Try a different search.</p>
      </div>
    </div>
  </section>

  </main>

</div>

<div class="selection-bar" id="selectionBar" hidden>
  <span class="selection-count" id="selectionCount">0 selected</span>
  <button class="selection-btn" data-selection-action="copy" id="selectionCopyBtn">Copy</button>
  <button class="selection-btn" data-selection-action="delete">Delete</button>
  <button class="selection-btn selection-btn-quiet" data-selection-action="clear">Cancel</button>
</div>

<!-- URL classifier — must load before app.js -->
<script src="papers.js"></script>
<script src="app.js"></script>
</body>
</html>
